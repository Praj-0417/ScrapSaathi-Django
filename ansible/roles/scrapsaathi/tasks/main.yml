---
# tasks file for scrapsaathi deployment role

- name: Update apt cache and install system prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - libpq-dev
      - build-essential
      - curl
      - git
    state: present
    update_cache: yes
  become: yes

- name: Create application service group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
  become: yes

- name: Create dedicated application service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    home: "{{ app_root_dir }}"
    create_home: yes
  become: yes

- name: Ensure application directories exist with correct permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_root_dir }}"
    - "{{ app_root_dir }}/backend"
    - "{{ app_root_dir }}/scripts"
    - "{{ app_root_dir }}/media"
  become: yes

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ app_root_dir }}/.venv"
    creates: "{{ app_root_dir }}/.venv/bin/python"
  become_user: "{{ app_user }}"
  become: yes

- name: Render environment configuration file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_root_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  become: yes
  notify: Restart scrapsaathi

- name: Copy backend requirements manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../backend/requirements.txt"
    dest: "{{ app_root_dir }}/backend/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  become: yes

- name: Install Python dependencies in isolated virtual environment
  ansible.builtin.pip:
    requirements: "{{ app_root_dir }}/backend/requirements.txt"
    virtualenv: "{{ app_root_dir }}/.venv"
  become_user: "{{ app_user }}"
  become: yes

- name: Deploy application source code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../backend/"
    dest: "{{ app_root_dir }}/backend/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes
  notify: Restart scrapsaathi

- name: Run Django database migrations
  ansible.builtin.command:
    cmd: "{{ app_root_dir }}/.venv/bin/python manage.py migrate --noinput"
    chdir: "{{ app_root_dir }}/backend"
  become_user: "{{ app_user }}"
  become: yes

- name: Install systemd unit service file
  ansible.builtin.template:
    src: scrapsaathi.service.j2
    dest: /etc/systemd/system/scrapsaathi.service
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify:
    - Reload systemd
    - Restart scrapsaathi

- name: Ensure ScrapSaathi service is enabled and started
  ansible.builtin.systemd:
    name: scrapsaathi
    enabled: yes
    state: started
  become: yes

- name: Verify application HTTP health after deployment
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 5
  delay: 2
  until: health_check.status == 200
